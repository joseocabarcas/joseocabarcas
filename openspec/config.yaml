# SDD configuration for josecabarcas.dev
# Generated by SDD init. Safe-derived context only; user-maintained SDD settings
# should be edited deliberately, not regenerated.

project:
  name: josecabarcas.dev
  description: >-
    Personal portfolio website of José Cabarcas, a Frontend Staff Engineer with
    11+ years of experience (React, React Native, Next.js, TypeScript).
    Built with Astro 5, deployed to Vercel.
  stack:
    language: TypeScript (strict, astro/tsconfigs/strict)
    framework: Astro 5.8
    package_manager: pnpm
    adapter: "@astrojs/vercel (serverless; output: 'server')"
    deployment: Vercel
  root: /Users/josecabarcas/Developments/WorkSpacePersonal/josecabarcas.dev

session:
  execution: auto
  artifact_store: openspec
  delivery_strategy: ask-on-risk
  review_budget: 400

testing:
  runner: none # no unit test runner installed
  type_check:
    command: pnpm build
    runs: astro check && astro build
    tools: ["@astrojs/check", "typescript ^5.4.5"]
  notes: >-
    Type checking is the only automated verification gate. Component logic is
    Astro (.astro) files with no unit-test seams; verification relies on
    `astro check`, build success, and manual/preview review (`pnpm preview`).

sdd:
  strict_tdd: false # cannot be enforced without a unit test runner; type-check + build gate used instead
  phase_rules:
    - Type-safety gate: `pnpm build` (astro check) must pass before any phase completes.
    - No unit tests may be written for .astro components until a runner (e.g. Vitest + @astrojs/testing) is installed; flag this as a risk instead.
    - Artifacts are persisted under openspec/ per phase topic key.
